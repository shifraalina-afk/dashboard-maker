<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula dash suite</title>
<style>
:root{--bg:#eef1f4;--pn:#fff;--ln:#d5dbe1;--ink:#1a2027;--mu:#5b6671;--ac:#a86300}
@media(prefers-color-scheme:dark){:root{--bg:#12161b;--pn:#1b2128;--ln:#2c343d;--ink:#e8edf2;--mu:#98a4b0;--ac:#ffb000}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln)}
header b{font-size:18px}nav{display:flex;flex-wrap:wrap;gap:5px}
button,.chip{font:600 13px system-ui;padding:6px 10px;border-radius:7px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);cursor:pointer;margin:0 5px 5px 0}
button[aria-selected=true],.on{background:var(--ac);border-color:var(--ac);color:#111}
main{padding:12px 14px}.g{display:grid;grid-template-columns:310px minmax(0,1fr);gap:12px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;min-width:0}
h2{font-size:15px;margin:12px 0 6px}h2:first-child{margin-top:0}
label{display:block;margin-top:8px;font-size:12px;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 7px;max-width:100%}
input[type=range]{width:100%;padding:0}textarea{width:100%;height:230px;font:12px monospace}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:2px 3px;text-align:left}td input,td select{width:100%;min-width:44px}
.mu{color:var(--mu);font-size:12px}svg{display:block;max-width:100%}
.dv{width:100%;max-height:68vh;background:#222;border-radius:10px}
@keyframes bl{50%{opacity:.15}}.fl{animation:bl .5s steps(1) infinite}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
@media print{@page{size:A3 landscape;margin:0}header,.noprint{display:none!important}body,main,.c{background:#fff;border:0;padding:0}.g{display:block}#sheet{width:420mm;height:297mm}}
@media(max-width:900px){.g{grid-template-columns:1fr}}
</style></head><body>
<header><b>Formula dash suite</b><nav id="nav"></nav></header><main id="m"></main>
<script>
const $=s=>document.querySelector(s),H=(a,b,c)=>Math.min(c,Math.max(a,b)),num=v=>v===''||v==null?null:+v,F={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dl=(n,t,m='text/plain')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const SHP={rrect:['Rounded rectangle',150,85],rect:['Rectangle',150,85],square:['Square',120,120],round:['Round',130,130],octagon:['Octagon',140,90],pill:['Wide pill',340,95],trap:['Tapered wing',160,80],arch:['Arched binnacle',330,130],twin:['Twin dial',380,140],custom:['Custom polygon',150,85]};
const VEH={f1:['F1 / open-wheel',[['rrect',150,85],['octagon',140,90],['rect',130,75],['trap',160,80]]],fs:['Formula Student',[['rrect',130,75],['octagon',120,85],['rect',590,170],['trap',150,80]]],sports:['Sports car',[['twin',380,140],['arch',330,130],['rrect',305,115],['round',150,150]]],hyper:['Supercar',[['pill',340,95],['rrect',300,110],['trap',320,110],['arch',330,120]]],rally:['Rally car',[['rect',220,110],['square',140,140],['round',120,120],['rrect',200,100]]],kart:['Go-kart',[['round',100,100],['square',90,90],['rect',110,65],['rrect',120,70]]],ev:['Electric car',[['rrect',305,115],['pill',400,100],['square',200,200],['arch',330,120]]]};
const C=(k,l,id,s,n,f,o,u,min,max)=>({k,l,id,s,n,f,o,u,min,max});
const W=(l,ch,lo=null,hi=null,fl=false)=>({l,ch,lo,hi,fl});
const GF=['Next page','Previous page','Launch control','TC up','TC down','Neutral','Pit limiter','Radio','Drink','Marker','Reset lap','Unassigned'],RF=['TC level','Brake bias','Engine map','Brightness','Page select','Unassigned'],PF=['Upshift','Downshift','Clutch','Unassigned'];
const D0=()=>({veh:'fs',shape:'rrect',w:130,h:75,r:10,poly:[],sw:110,sh:62,mode:'n',page:'Race',drv:'',drivers:{},
ch:[C('rpm','Engine speed','640',0,16,1,0,'rpm',0,13000),C('speed','Speed','641',0,16,.1,0,'km/h',0,140),C('gear','Gear','641',16,4,1,0,'',0,6),C('coolant','Coolant','642',0,8,1,-40,'°C',40,120),C('oil','Oil pressure','642',8,8,.05,0,'bar',0,8),C('batt','Battery','643',0,16,.01,0,'V',10,15),C('tps','Throttle','643',16,8,.5,0,'%',0,100),C('brake','Brake','644',0,16,.1,0,'bar',0,100),C('lc','Launch control','645',0,1,1,0,'',0,1),C('tc','Traction level','645',8,4,1,0,'',0,10)],
pages:{Race:[W('Speed','speed'),W('RPM','rpm',null,12500,1),W('Gear','gear'),W('Coolant','coolant',null,105,1),W('Oil','oil',1.5,null,1),W('Battery','batt',11.5)],Practice:[W('Speed','speed'),W('Throttle','tps'),W('Brake','brake'),W('Coolant','coolant',null,105),W('Oil','oil',1.5),W('Battery','batt',11.5)],Diagnostics:[W('Coolant','coolant',null,105,1),W('Oil','oil',1.5,null,1),W('Battery','batt',11.5,null,1),W('Throttle','tps'),W('Brake','brake'),W('Traction','tc'),W('Launch','lc')]},
shift:[[7000,10500],[8000,11000],[8500,11500],[9000,11800],[9000,12000],[9000,12000]],
wheel:[['b',38,70,'Next page'],['b',38,110,'Launch control'],['b',38,150,'Neutral'],['b',262,70,'TC up'],['b',262,110,'TC down'],['b',262,150,'Pit limiter'],['r',95,155,'TC level'],['r',205,155,'Brake bias'],['p',6,100,'Upshift'],['p',294,100,'Downshift']],
ks:{dia:40,edge:14,t:3,amps:10,runs:[['Battery to master switch',600],['Right external switch',900],['Left external switch',900],['Cockpit button',1200],['Shutdown loop to ECU',1500]]}});
let S;try{S=Object.assign(D0(),JSON.parse(localStorage.getItem('fds')||'{}'))}catch(e){S=D0()}
const save=()=>{try{localStorage.setItem('fds',JSON.stringify(S))}catch(e){}};
/* geometry */
function rr(w,h,r,n=8){r=Math.min(r,w/2,h/2);const p=[];[[r,r,180],[w-r,r,270],[w-r,h-r,0],[r,h-r,90]].forEach(([x,y,a])=>{for(let i=0;i<=n;i++){const t=(a+90*i/n)*Math.PI/180;p.push([x+r*Math.cos(t),y+r*Math.sin(t)])}});return p}
function outline(){const{shape:s,w,h,r}=S;
if(s=='custom'&&S.poly.length>2)return S.poly;
if(s=='round')return Array.from({length:48},(_,i)=>[w/2+w/2*Math.cos(i/48*6.2832),h/2+h/2*Math.sin(i/48*6.2832)]);
if(s=='octagon'){const c=Math.min(w,h)*.22;return[[c,0],[w-c,0],[w,c],[w,h-c],[w-c,h],[c,h],[0,h-c],[0,c]]}
if(s=='trap'){const i=w*.08;return[[i,0],[w-i,0],[w,h],[0,h]]}
if(s=='arch'){const k=h*.18,p=[];for(let i=0;i<=24;i++){const t=i/24;p.push([w*t,k*(1-2*t)**2])}return[...p,[w,h],[0,h]]}
return rr(w,h,s=='pill'?h/2:s=='twin'?h*.3:r)}
function geom(){const pts=outline(),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys);return{pts,x0,y0,w:Math.max(...xs)-x0,h:Math.max(...ys)-y0}}
const segs=p=>p.map((a,i)=>[...a,...p[(i+1)%p.length]]);
const dxf=(L=[],Ci=[])=>'0\nSECTION\n2\nENTITIES\n'+L.map(([a,b,c,d])=>`0\nLINE\n8\n0\n10\n${a.toFixed(2)}\n20\n${(-b).toFixed(2)}\n30\n0\n11\n${c.toFixed(2)}\n21\n${(-d).toFixed(2)}\n31\n0\n`).join('')+Ci.map(([x,y,r])=>`0\nCIRCLE\n8\n0\n10\n${x}\n20\n${-y}\n30\n0\n40\n${r}\n`).join('')+'0\nENDSEC\n0\nEOF\n';
const tx=(x,y,s,z,f,wt=700,a='middle')=>`<text x="${x}" y="${y}" font-size="${z}" fill="${f}" font-weight="${wt}" text-anchor="${a}" dominant-baseline="central">${s}</text>`;
function dimH(x1,x2,y,yf,t,f){return`<path d="M${x1} ${yf}V${y+f*.4}M${x2} ${yf}V${y+f*.4}M${x1} ${y}H${x2}" stroke="#000" stroke-width="${f*.07}" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>`+tx((x1+x2)/2,y-f*.7,t,f,'#000',500)}
function dimV(y1,y2,x,xf,t,f){return`<path d="M${xf} ${y1}H${x+f*.4}M${xf} ${y2}H${x+f*.4}M${x} ${y1}V${y2}" stroke="#000" stroke-width="${f*.07}" fill="none" marker-start="url(#a)" marker-end="url(#a)"/><text transform="translate(${x+f*.9} ${(y1+y2)/2}) rotate(90)" font-size="${f}" text-anchor="middle" dominant-baseline="central">${t}</text>`}
const MK=f=>`<defs><marker id="a" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="${f*.9}" markerHeight="${f*.54}" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 3L0 6z"/></marker></defs>`;
/* data */
let live=0,V={},logs=[],T=0,paint=null,cur='';
const chOf=k=>S.ch.find(c=>c.k==k)||S.ch[0];
function sim(c,i){if(c.k=='gear')return 1+Math.floor((T*.2%1)*5);if(c.k=='lc')return Math.sin(T*.7)>.8?1:0;const p=.5+.45*Math.sin(T*(.4+i*.17)+i);const v=c.min+(c.max-c.min)*p;return c.k=='tc'?Math.round(v):v}
const val=k=>{if(live&&V[k]!=null)return V[k];const i=S.ch.findIndex(c=>c.k==k);return i<0?0:sim(S.ch[i],i)};
const fv=(v,c)=>v.toFixed(c.f<.1?2:c.f<1?1:0);
const PAL={n:{bg:'#0b0f14',fg:'#e8edf2',mu:'#8b97a3',ok:'#3ddc84',wn:'#ff453a',ac:'#ffb000',ti:'#1a2027'},c:{bg:'#0b0f14',fg:'#fff',mu:'#a8b3bf',ok:'#4da3ff',wn:'#ff9f1a',ac:'#f0e442',ti:'#1a2027'},s:{bg:'#fff',fg:'#000',mu:'#222',ok:'#00508c',wn:'#c00000',ac:'#000',ti:'#ccc'}};
const isW=w=>{const v=val(w.ch);return(w.lo!=null&&v<w.lo)||(w.hi!=null&&v>w.hi)};
function leds(x,y,wd,ht,rpm,gear,P){const sh=S.shift[H(Math.round(gear),1,6)-1],p=H((rpm-sh[0])/(sh[1]-sh[0]),0,1),fl=rpm>=sh[1]&&(T*6|0)%2,pw=wd/15;let g='';for(let i=0;i<15;i++){const on=fl||i<Math.round(p*15),k=i<5?P.ok:i<10?P.ac:P.wn;g+=`<rect x="${x+i*pw}" y="${y}" width="${pw*.78}" height="${ht}" rx="${ht*.3}" fill="${on?k:P.ti}"/>`}return g}
function dashSVG(){const g=geom(),P=PAL[S.mode],pg=S.pages[S.page]||[],{w,h,x0,y0}=g,n=pg.length||1;
let o=`<defs><clipPath id="cp"><polygon points="${g.pts}"/></clipPath></defs><polygon points="${g.pts}" fill="${P.bg}" stroke="${S.mode=='s'?'#000':'#6b7682'}" stroke-width="${Math.max(w,h)*.012}"/><g clip-path="url(#cp)">`;
const ws=pg.filter(isW);
o+=leds(x0+w*.15,y0+h*.04,w*.7,h*.07,val('rpm'),val('gear'),P);
if(ws.length){const q=ws[0],v=val(q.ch);o+=`<g class="${q.fl?'fl':''}"><rect x="${x0+w*.1}" y="${y0+h*.13}" width="${w*.8}" height="${h*.09}" rx="${h*.02}" fill="${P.wn}"/>${tx(x0+w/2,y0+h*.175,esc(q.l)+(q.lo!=null&&v<q.lo?' LOW':' HIGH'),h*.065,S.mode=='s'?'#fff':'#000')}</g>`}
const cols=Math.max(1,Math.round(Math.sqrt(n*w/(h*.7)))),rows=Math.ceil(n/cols),ax=x0+w*.08,aw=w*.84,ay=y0+h*.24,ah=h*.62,cw=aw/cols,ch=ah/rows;
pg.forEach((q,i)=>{const c=chOf(q.ch),v=val(q.ch),x=ax+i%cols*cw,y=ay+Math.floor(i/cols)*ch,wn=isW(q),k=wn?P.wn:P.fg,pr=H((v-c.min)/(c.max-c.min||1),0,1),z=Math.min(ch*.4,cw*.2);
o+=`<g class="${wn&&q.fl?'fl':''}">`+tx(x+cw/2,y+ch*.17,esc(q.l),Math.min(ch*.16,cw*.1),P.mu,500)+tx(x+cw/2,y+ch*.5,fv(v,c),z,k)+`<rect x="${x+cw*.12}" y="${y+ch*.78}" width="${cw*.76}" height="${ch*.08}" fill="${P.ti}"/><rect x="${x+cw*.12}" y="${y+ch*.78}" width="${cw*.76*pr}" height="${ch*.08}" fill="${wn?P.wn:P.ok}"/></g>`});
o+=tx(x0+w*.38,y0+h*.94,'LC '+(val('lc')>.5?'ON':'off'),h*.05,val('lc')>.5?P.ok:P.mu)+tx(x0+w*.62,y0+h*.94,'TC '+Math.round(val('tc')),h*.05,P.ac);
return o+'</g>'}
function setVB(el,g,pad=0){el.setAttribute('viewBox',`${g.x0-pad} ${g.y0-pad} ${g.w+2*pad} ${g.h+2*pad}`)}
/* tabs */
const TB=[['shape','Shape'],['dash','Dash pages'],['can','CAN and live'],['shift','Shift lights'],['wheel','Wheel'],['kill','Kill switch'],['draw','Drawing'],['laps','Laps and drivers'],['exp','Export']];
function go(t){cur=t;paint=null;$('#m').oninput=null;$('#nav').innerHTML=TB.map(([k,l])=>`<button data-t="${k}" aria-selected="${k==t}">${l}</button>`).join('');F[t]();save()}
$('#nav').onclick=e=>{if(e.target.dataset.t)go(e.target.dataset.t)};
setInterval(()=>{T+=.12;paint&&paint()},120);
const opt=(a,s)=>a.map(x=>`<option${x==s?' selected':''}>${esc(x)}</option>`).join('');
/* shape */
F.shape=()=>{
$('#m').innerHTML=`<div class="g"><div class="c"><h2>Car type</h2><select id="ve">${Object.keys(VEH).map(k=>`<option value="${k}"${k==S.veh?' selected':''}>${VEH[k][0]}</option>`).join('')}</select><div id="sg" style="margin-top:8px"></div><h2>Shape</h2><select id="sh">${Object.keys(SHP).map(k=>`<option value="${k}"${k==S.shape?' selected':''}>${SHP[k][0]}</option>`).join('')}</select>
<label>Width <span id="vw"></span> mm<input type="range" id="w" min="60" max="700" step="5"></label><label>Height <span id="vh"></span> mm<input type="range" id="h" min="40" max="300" step="5"></label><label>Corner radius <span id="vr"></span> mm<input type="range" id="r" min="0" max="40"></label>
<h2>Custom polygon</h2><button id="mc">Edit current outline as polygon</button><button id="cl">Clear points</button><p class="mu">Click to add a point, drag a point to move it, shift-click a point to delete it. Sizes follow the points.</p></div><div class="c"><svg id="sv" class="dv"></svg></div></div>`;
const rs=()=>{$('#vw').textContent=S.w;$('#vh').textContent=S.h;$('#vr').textContent=S.r;['w','h','r'].forEach(k=>$('#'+k).value=S[k]);$('#sg').innerHTML=VEH[S.veh][1].map(([s,w,h],i)=>`<button class="chip${s==S.shape&&w==S.w?' on':''}" data-i="${i}">${SHP[s][0]} ${w}×${h}${i?'':' (best)'}</button>`).join('')};
const dr=()=>{const g=geom(),f=Math.max(g.w,g.h)*.035,sv=$('#sv');setVB(sv,{x0:g.x0-f*2,y0:g.y0-f*2,w:g.w+f*7,h:g.h+f*6});
sv.innerHTML=MK(f).replace('<path','<path fill="#9aa5b1"')+`<polygon points="${g.pts}" fill="#0b0f14" stroke="#9aa5b1" stroke-width="${f*.25}"/>`+(S.shape=='custom'?S.poly.map((p,i)=>`<circle data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="${f*.8}" fill="#ffb000"/>`).join(''):'')+dimH(g.x0,g.x0+g.w,g.y0+g.h+f*2.4,g.y0+g.h,g.w.toFixed(0)+' mm',f).replace(/#000/g,'#9aa5b1').replace('<text','<text fill="#9aa5b1"')+dimV(g.y0,g.y0+g.h,g.x0+g.w+f*2.4,g.x0+g.w,g.h.toFixed(0)+' mm',f).replace(/#000/g,'#9aa5b1').replace('<text','<text fill="#9aa5b1"')};
const ch=()=>{rs();dr();save()};
$('#ve').onchange=e=>{S.veh=e.target.value;const[s,w,h]=VEH[S.veh][1][0];Object.assign(S,{shape:s,w,h});$('#sh').value=s;ch()};
$('#sg').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;const[s,w,h]=VEH[S.veh][1][i];Object.assign(S,{shape:s,w,h});$('#sh').value=s;ch()};
$('#sh').onchange=e=>{S.shape=e.target.value;if(S.shape!='custom'){S.w=SHP[S.shape][1];S.h=SHP[S.shape][2]}ch()};
['w','h','r'].forEach(k=>$('#'+k).oninput=e=>{S[k]=+e.target.value;dr();rs()});
$('#mc').onclick=()=>{S.poly=outline().map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)]);S.shape='custom';$('#sh').value='custom';ch()};
$('#cl').onclick=()=>{S.poly=[];S.shape='custom';$('#sh').value='custom';ch()};
let dg=-1;const sv=$('#sv'),pt=e=>{const q=sv.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const p=q.matrixTransform(sv.getScreenCTM().inverse());return[+p.x.toFixed(1),+p.y.toFixed(1)]};
sv.onpointerdown=e=>{if(S.shape!='custom')return;const i=e.target.dataset.i,p=pt(e);
if(i!=null){if(e.shiftKey){S.poly.splice(+i,1);dr()}else{dg=+i;sv.setPointerCapture(e.pointerId)}return}
if(S.poly.length<2){S.poly.push(p);dr();return}
let b=0,bd=1e9;S.poly.forEach((a,j)=>{const c=S.poly[(j+1)%S.poly.length],dx=c[0]-a[0],dy=c[1]-a[1],t=H(((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1),0,1),d=Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);if(d<bd){bd=d;b=j}});S.poly.splice(b+1,0,p);dr()};
sv.onpointermove=e=>{if(dg>=0){S.poly[dg]=pt(e);dr()}};sv.onpointerup=()=>{dg=-1;save()};
ch()};
/* dash */
F.dash=()=>{
$('#m').innerHTML=`<div class="g"><div class="c"><h2>Page</h2><div id="pb"></div><button id="nx">Wheel button: next page</button><label>Display mode<select id="md"><option value="n">Normal</option><option value="c">Colour-blind safe</option><option value="s">Bright sun</option></select></label><h2>Widgets and warning rules</h2><div id="wt"></div><button id="ad">Add widget</button><p class="mu">Low and high limits turn a widget into an alert and show a banner. Flash makes it blink. Channels come from the CAN tab.</p></div><div class="c"><svg id="dv" class="dv"></svg></div></div>`;
$('#md').value=S.mode;
const tb=()=>{$('#pb').innerHTML=Object.keys(S.pages).map(p=>`<button class="chip${p==S.page?' on':''}" data-p="${p}">${p}</button>`).join('');
$('#wt').innerHTML='<table><tr><th>Name</th><th>Channel</th><th>Low</th><th>High</th><th>Flash</th><th></th></tr>'+S.pages[S.page].map((q,i)=>`<tr><td><input data-i="${i}" data-f="l" value="${esc(q.l)}"></td><td><select data-i="${i}" data-f="ch">${S.ch.map(c=>`<option${c.k==q.ch?' selected':''}>${c.k}</option>`).join('')}</select></td><td><input type="number" data-i="${i}" data-f="lo" value="${q.lo??''}"></td><td><input type="number" data-i="${i}" data-f="hi" value="${q.hi??''}"></td><td><input type="checkbox" data-i="${i}" data-f="fl"${q.fl?' checked':''}></td><td><button data-x="${i}">×</button></td></tr>`).join('')+'</table>'};
$('#pb').onclick=e=>{if(e.target.dataset.p){S.page=e.target.dataset.p;tb()}};
$('#nx').onclick=()=>{const k=Object.keys(S.pages);S.page=k[(k.indexOf(S.page)+1)%k.length];tb()};
$('#md').onchange=e=>S.mode=e.target.value;
$('#ad').onclick=()=>{S.pages[S.page].push(W('New','rpm'));tb()};
$('#wt').oninput=e=>{const t=e.target,i=t.dataset.i,f=t.dataset.f;if(i==null)return;S.pages[S.page][i][f]=f=='fl'?t.checked:f=='lo'||f=='hi'?num(t.value):t.value};
$('#wt').onclick=e=>{if(e.target.dataset.x){S.pages[S.page].splice(+e.target.dataset.x,1);tb()}};
tb();const g=geom();setVB($('#dv'),g,Math.max(g.w,g.h)*.03);paint=()=>{if($('#dv'))$('#dv').innerHTML=dashSVG()}};
/* can */
function feed(l){if(!l)return;logs.unshift(l);logs.length=6;live=1;
if(l[0]=='{'){try{Object.assign(V,JSON.parse(l))}catch(e){}return}
const m=l.match(/^([0-9a-f]{3,8})((?: [0-9a-f]{2}){1,8})$/i);
if(m){const id=parseInt(m[1],16),b=m[2].trim().split(' ').map(x=>parseInt(x,16));let n=0n;b.forEach((x,i)=>n|=BigInt(x)<<BigInt(8*i));S.ch.forEach(c=>{if(parseInt(c.id,16)==id)V[c.k]=Number((n>>BigInt(c.s))&((1n<<BigInt(c.n))-1n))*c.f+c.o});return}
l.split(/[ ,;]+/).forEach(t=>{const[a,b]=t.split('=');if(a&&b!=null&&!isNaN(b))V[a]=+b})}
const lines=cb=>{let b='';return s=>{b+=s;let i;while((i=b.indexOf('\n'))>=0){cb(b.slice(0,i).trim());b=b.slice(i+1)}}};
F.can=()=>{
$('#m').innerHTML=`<div class="c"><h2>Live data</h2><button id="ss">Connect USB serial</button><button id="bt">Connect Bluetooth (UART)</button><button id="sm">Use simulation</button> Baud <input id="bd" type="number" value="115200" style="width:90px"><p id="st" class="mu">Showing simulated data. Web Serial and Web Bluetooth need Chrome or Edge.</p><pre id="lg" class="mu"></pre>
<p class="mu">Send one line per message. Raw CAN frame: <code>640 12 34 56 78</code> (hex id, then bytes, little-endian). Or <code>rpm=9500 speed=88.2</code>. Or JSON: <code>{"rpm":9500}</code>.</p>
<h2>CAN signal mapper</h2><div style="overflow:auto"><table><tr><th>Key</th><th>Name</th><th>ID hex</th><th>Start bit</th><th>Bits</th><th>Factor</th><th>Offset</th><th>Unit</th><th>Min</th><th>Max</th><th>Now</th></tr>${S.ch.map((c,i)=>`<tr>${['k','l','id','s','n','f','o','u','min','max'].map(f=>`<td><input data-i="${i}" data-f="${f}" value="${esc(c[f])}"></td>`).join('')}<td id="nv${i}"></td></tr>`).join('')}</table></div><button id="ac">Add channel</button></div>`;
$('#ss').onclick=async()=>{try{const p=await navigator.serial.requestPort();await p.open({baudRate:+$('#bd').value||115200});$('#st').textContent='Serial connected.';const r=p.readable.pipeThrough(new TextDecoderStream()).getReader(),f=lines(feed);for(;;){const{value,done}=await r.read();if(done)break;f(value)}}catch(e){$('#st').textContent='Serial: '+e.message}};
$('#bt').onclick=async()=>{try{const N='6e400001-b5a3-f393-a9bb-e50e24dcca9e',d=await navigator.bluetooth.requestDevice({filters:[{services:[N]}]}),s=await(await d.gatt.connect()).getPrimaryService(N),c=await s.getCharacteristic('6e400003-b5a3-f393-a9bb-e50e24dcca9e'),f=lines(feed);c.addEventListener('characteristicvaluechanged',e=>f(new TextDecoder().decode(e.target.value)));await c.startNotifications();$('#st').textContent='Bluetooth connected.'}catch(e){$('#st').textContent='Bluetooth: '+e.message}};
$('#sm').onclick=()=>{live=0;V={};$('#st').textContent='Showing simulated data.'};
$('#m').oninput=e=>{const t=e.target,i=t.dataset.i;if(i==null)return;const f=t.dataset.f;S.ch[i][f]=['s','n','f','o','min','max'].includes(f)?+t.value:t.value};
$('#ac').onclick=()=>{S.ch.push(C('new','New channel','700',0,8,1,0,'',0,100));F.can()};
paint=()=>{S.ch.forEach((c,i)=>{const e=$('#nv'+i);if(e)e.textContent=fv(val(c.k),c)});$('#lg').textContent=logs.join('\n')}};
/* shift */
F.shift=()=>{
$('#m').innerHTML=`<div class="g"><div class="c"><h2>RPM points per gear</h2><table><tr><th>Gear</th><th>LEDs start</th><th>Redline flash</th></tr>${S.shift.map((s,i)=>`<tr><td>${i+1}</td><td><input type="number" data-i="${i}" data-j="0" value="${s[0]}"></td><td><input type="number" data-i="${i}" data-j="1" value="${s[1]}"></td></tr>`).join('')}</table><label>Test gear <span id="tg">3</span><input type="range" id="gr" min="1" max="6" value="3"></label><label>Test rpm <span id="tr"></span><input type="range" id="rp" min="3000" max="13000" step="50" value="9000"></label><p class="mu">LEDs fill from the start point to the redline, then flash.</p></div><div class="c"><svg id="ls" viewBox="0 0 300 40" style="width:100%"></svg></div></div>`;
$('#m').oninput=e=>{const t=e.target;if(t.dataset.i!=null)S.shift[t.dataset.i][t.dataset.j]=+t.value};
paint=()=>{const g=+$('#gr').value,r=+$('#rp').value;$('#tg').textContent=g;$('#tr').textContent=r;$('#ls').innerHTML=leds(10,8,280,24,r,g,PAL[S.mode])}};
/* wheel */
F.wheel=()=>{
$('#m').innerHTML=`<div class="g"><div class="c"><h2>Button map</h2><div id="bm"></div><button data-a="b">Add button</button><button data-a="r">Add rotary</button><button data-a="p">Add paddle</button><p class="mu">Drag items on the wheel to place them. Positions are in mm.</p><button id="wd">Download wheel DXF</button></div><div class="c"><svg id="wv" viewBox="-5 -5 310 210" class="dv" style="background:var(--pn)"></svg></div></div>`;
const dp=()=>{const g=geom(),dw=Math.min(g.w,150),dh=Math.min(g.h,95);return[150-dw/2,22,dw,dh]};
const dr=()=>{const[x,y,w,h]=dp();$('#wv').innerHTML=`<path d="M${rr(280,190,70).map(p=>(p[0]+10)+' '+(p[1]+5)).join('L')}Z" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#0b0f14" stroke="#9aa5b1"/>`+tx(150,y+h/2,'display',8,'#8b97a3',500)+S.wheel.map((q,i)=>`<g data-i="${i}" style="cursor:grab">${q[0]=='p'?`<rect x="${q[1]-5}" y="${q[2]-30}" width="10" height="60" rx="3" fill="#ffb000"/>`:`<circle cx="${q[1]}" cy="${q[2]}" r="${q[0]=='r'?14:8}" fill="${q[0]=='r'?'#4da3ff':'#ffb000'}"/>`}<text x="${q[1]}" y="${q[2]+(q[0]=='p'?38:q[0]=='r'?23:17)}" font-size="5" text-anchor="middle" fill="currentColor">${esc(q[3])}</text></g>`).join('')};
const bm=()=>{$('#bm').innerHTML='<table>'+S.wheel.map((q,i)=>`<tr><td>${{b:'Button',r:'Rotary',p:'Paddle'}[q[0]]}</td><td><select data-i="${i}">${opt({b:GF,r:RF,p:PF}[q[0]],q[3])}</select></td><td><button data-x="${i}">×</button></td></tr>`).join('')+'</table>'};
$('#bm').onchange=e=>{if(e.target.dataset.i!=null){S.wheel[e.target.dataset.i][3]=e.target.value;dr()}};
$('#bm').onclick=e=>{if(e.target.dataset.x!=null){S.wheel.splice(+e.target.dataset.x,1);bm();dr()}};
$('.c').onclick=e=>{const a=e.target.dataset.a;if(a){S.wheel.push([a,150,100,'Unassigned']);bm();dr()}};
let d=-1;const v=$('#wv');
v.onpointerdown=e=>{const g=e.target.closest('g[data-i]');if(g){d=+g.dataset.i;v.setPointerCapture(e.pointerId)}};
v.onpointermove=e=>{if(d<0)return;const q=v.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const p=q.matrixTransform(v.getScreenCTM().inverse());S.wheel[d][1]=Math.round(H(p.x,0,300));S.wheel[d][2]=Math.round(H(p.y,0,200));dr()};
v.onpointerup=()=>{d=-1;save()};
$('#wd').onclick=()=>{const[x,y,w,h]=dp(),L=[...segs(rr(280,190,70).map(p=>[p[0]+10,p[1]+5])),...segs([[x,y],[x+w,y],[x+w,y+h],[x,y+h]])],Ci=[];S.wheel.forEach(q=>{if(q[0]=='p')L.push(...segs([[q[1]-5,q[2]-30],[q[1]+5,q[2]-30],[q[1]+5,q[2]+30],[q[1]-5,q[2]+30]]));else Ci.push([q[1],q[2],q[0]=='r'?7.5:4.2])});dl('wheel.dxf',dxf(L,Ci))};
bm();dr()};
/* kill switch */
F.kill=()=>{const K=S.ks;
$('#m').innerHTML=`<div class="g"><div class="c"><h2>Settings</h2><label>Button diameter mm<input type="number" id="kd" value="${K.dia}"></label><label>Plate edge margin mm<input type="number" id="ke" value="${K.edge}"></label><label>Plate thickness mm<input type="number" id="kt" value="${K.t}"></label><label>Loop current A<input type="number" id="ka" value="${K.amps}"></label><h2>Cable runs, mm</h2>${K.runs.map((r,i)=>`<label>${r[0]}<input type="number" data-i="${i}" value="${r[1]}"></label>`).join('')}<button id="kx" style="margin-top:10px">Download bracket DXF</button></div><div class="c"><svg id="kv" viewBox="0 0 800 220" style="width:100%"></svg><pre id="ko"></pre><p class="mu">Check switch position, size and marking against your current rulebook. The wiring is a series shutdown loop: any open switch drops the relay.</p></div></div>`;
const up=()=>{const n=['Battery +','Master switch right','Master switch left','Cockpit button','Shutdown relay / ECU'];
$('#kv').innerHTML=n.map((t,i)=>`<rect x="${10+i*158}" y="70" width="128" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>${tx(74+i*158,100,t,13,'currentColor',600)}`).join('')+K.runs.map((r,i)=>`<path d="M${138+i*158} 100h30" stroke="${i==4?'none':'currentColor'}" stroke-width="2"/>${i<4?tx(153+i*158,86,(r[1]/1000)+' m',10,'#888',500):''}`).join('')+`<path d="M714 130v50H74v-50" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>${tx(400,196,'Ground return (chassis ground or dedicated wire)',12,'#888',500)}`;
const tot=K.runs.reduce((a,r)=>a+(+r[1]||0),0)*1.15+12*50,A=K.amps,g=A<=3?['0.5','20']:A<=8?['1.0','18']:A<=13?['1.5','16']:A<=20?['2.5','14']:A<=30?['4','12']:A<=40?['6','10']:['10+','8 or thicker'];
const S2=K.dia+2*K.edge;$('#ko').textContent=`Cable estimate: ${(tot/1000).toFixed(2)} m (runs +15% slack + 12 terminals × 50 mm)\nSuggested wire: ${g[0]} mm² (about ${g[1]} AWG) for ${A} A\nBracket plate: ${S2} × ${S2} × ${K.t} mm, centre hole Ø${K.dia+.5}, 4 × Ø4.5`};
$('.c').oninput=e=>{const t=e.target;if(t.dataset.i!=null)K.runs[t.dataset.i][1]=+t.value;else K[{kd:'dia',ke:'edge',kt:'t',ka:'amps'}[t.id]]=+t.value;up()};
$('#kx').onclick=()=>{const s=K.dia+2*K.edge,h=s/2-7,p=[[0,0],[s,0],[s,s],[0,s]],o=[];dl('kill-switch-bracket.dxf',dxf(segs(p),[[s/2,s/2,(K.dia+.5)/2],...[[7,7],[s-7,7],[s-7,s-7],[7,s-7]].map(a=>[...a,2.25])]))};
up()};
/* drawing */
F.draw=()=>{
$('#m').innerHTML=`<div class="c noprint"><button id="pr">Print sheet</button><button id="dx">Download outline DXF</button> Screen window <input id="sw" type="number" value="${S.sw}" style="width:70px"> × <input id="sh" type="number" value="${S.sh}" style="width:70px"> mm <span class="mu">Shape and size come from the Shape tab. Print with “Actual size” on A3.</span></div><svg id="sheet" viewBox="0 0 420 297" style="width:100%;background:#fff;color:#000;margin-top:10px"></svg>`;
const dr=()=>{const g=geom(),s=Math.min(1,300/g.w,170/g.h),f=3.2,ox=40-g.x0*s,oy=60-g.y0*s,X=v=>ox+v*s,Y=v=>oy+v*s,pts=g.pts.map(p=>X(p[0])+','+Y(p[1])),sw=Math.min(S.sw,g.w*.8),sh=Math.min(S.sh,g.h*.8),cx=X(g.x0+g.w/2),cy=Y(g.y0+g.h/2);
let o=MK(f)+`<rect x="10" y="10" width="400" height="277" fill="none" stroke="#000" stroke-width=".7"/><polygon points="${pts}" fill="none" stroke="#000" stroke-width=".6"/><rect x="${cx-sw*s/2}" y="${cy-sh*s/2}" width="${sw*s}" height="${sh*s}" fill="none" stroke="#000" stroke-width=".4" stroke-dasharray="3 1.5"/>`
+dimH(X(g.x0),X(g.x0+g.w),Y(g.y0)-12,Y(g.y0),g.w.toFixed(1),f)+dimV(Y(g.y0),Y(g.y0+g.h),X(g.x0+g.w)+12,X(g.x0+g.w),g.h.toFixed(1),f)+dimH(cx-sw*s/2,cx+sw*s/2,cy+sh*s/2+10,cy+sh*s/2,sw.toFixed(1),f*.8)
+`<text x="40" y="46" font-size="4.5">FRONT VIEW  ${esc(SHP[S.shape][0])}</text><text x="40" y="${Y(g.y0+g.h)+24}" font-size="3.2">Dashed rectangle: screen window. Dimensions in mm. Tolerance ±0.5. Break all sharp edges.</text><rect x="260" y="245" width="150" height="42" fill="none" stroke="#000" stroke-width=".4"/><path d="M260 259H410M260 273H410M310 259V287M360 259V287" stroke="#000" stroke-width=".35"/><text x="263" y="253" font-size="5.5">DASHBOARD PANEL</text><text x="263" y="266" font-size="3.4">Car: ${esc(VEH[S.veh][0])}</text><text x="313" y="266" font-size="3.4">Scale 1:${(1/s).toFixed(1)}</text><text x="363" y="266" font-size="3.4">Sheet A3</text><text x="263" y="280" font-size="3.4">Driver: ${esc(S.drv||'-')}</text><text x="313" y="280" font-size="3.4">Date ${new Date().toISOString().slice(0,10)}</text><text x="363" y="280" font-size="3.4">Units mm</text>`;
$('#sheet').innerHTML=o};
$('#pr').onclick=()=>{try{print()}catch(e){}};
$('#dx').onclick=()=>dl('dash-outline.dxf',dxf(segs(geom().pts.map(p=>[p[0],p[1]]))));

/* laps and drivers */
F.laps=()=>{
const N=120,A=[],B=[];for(let i=0;i<N;i++){const d=i/N;A.push(60+50*Math.abs(Math.sin(d*12.57+.5)));B.push(A[i]*(1+.05*Math.sin(d*9+1)))}
const tm=a=>{let t=0;return a.map(v=>t+=8/(v/3.6))},tA=tm(A),tB=tm(B);
$('#m').innerHTML=`<div class="g"><div class="c"><h2>Driver profiles</h2><label>Name<input id="dn" value="${esc(S.drv)}"></label><button id="sv">Save layout for driver</button><label>Load<select id="dl"><option value="">Choose</option>${Object.keys(S.drivers).map(k=>`<option>${esc(k)}</option>`).join('')}</select></label><button id="ld">Load</button><button id="dd">Delete</button><p class="mu">A profile stores shape, pages, warnings, shift points, wheel map and display mode.</p></div><div class="c"><h2>Lap replay (sample data)</h2><svg id="lp" viewBox="0 0 400 140" style="width:100%"></svg><input type="range" id="sc" min="0" max="${N-1}" value="0" style="width:100%"><p id="lo"></p><p class="mu">Blue is the best lap, orange is the current lap. Load your own logs by adding a data source in a later version.</p></div></div>`;
const pl=a=>a.map((v,i)=>`${i*400/N},${130-v}`).join(' '),up=()=>{const i=+$('#sc').value;$('#lp').innerHTML=`<polyline points="${pl(A)}" fill="none" stroke="#4da3ff" stroke-width="2"/><polyline points="${pl(B)}" fill="none" stroke="#ff9f1a" stroke-width="2"/><path d="M${i*400/N} 0V140" stroke="currentColor"/>`;$('#lo').textContent=`Distance ${(i/N*100).toFixed(0)} %. Best ${A[i].toFixed(0)} km/h, current ${B[i].toFixed(0)} km/h. Delta ${(tB[i]-tA[i]>=0?'+':'')}${(tB[i]-tA[i]).toFixed(2)} s`};
$('#sc').oninput=up;up();
const pk=()=>({shape:S.shape,w:S.w,h:S.h,r:S.r,poly:S.poly,pages:S.pages,shift:S.shift,wheel:S.wheel,mode:S.mode,ch:S.ch});
$('#sv').onclick=()=>{const n=$('#dn').value.trim();if(n){S.drv=n;S.drivers[n]=JSON.parse(JSON.stringify(pk()));save();F.laps()}};

F.exp=()=>{

$('#cd').value=code();
$('#e1').onclick=()=>dl('dash_config.h',code());$('#e2').onclick=()=>dl('dash-project.json',JSON.stringify(S,null,1),'application/json');
